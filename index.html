<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priyanshu Singh | Personal Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;min-height:100vh;background:linear-gradient(135deg,#08080b,#191027,#08080b);color:#fff}
.wrap{max-width:760px;margin:auto;padding:25px 16px 40px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:28px;overflow:hidden;backdrop-filter:blur(15px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.hero{text-align:center;padding:38px 20px 30px}
.photo{width:165px;height:165px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 0 35px rgba(200,90,255,.5)}
h1{font-size:clamp(34px,9vw,58px);margin:18px 0 7px;font-weight:900}
.sub{color:#c9c3d3}
.badge{display:inline-block;margin-top:14px;padding:8px 15px;border-radius:99px;background:rgba(255,255,255,.1);color:#ddd;font-size:13px}
section{padding:24px;border-top:1px solid rgba(255,255,255,.1)}
h2{font-size:20px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{padding:16px;border-radius:17px;background:rgba(255,255,255,.06)}
.label{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:1px}
.value{font-size:18px;font-weight:700;margin-top:6px}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mark{text-align:center;padding:18px;background:rgba(255,255,255,.06);border-radius:18px}
.mark strong{display:block;font-size:32px;margin:5px}
.btn{display:block;text-decoration:none;text-align:center;padding:15px;border-radius:15px;background:#fff;color:#111;font-weight:800;margin-top:10px}
footer{text-align:center;color:#777;font-size:12px;margin-top:18px}
@media(max-width:550px){.grid{grid-template-columns:1fr}.photo{width:145px;height:145px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="hero">
<img src="profile.png" class="photo" alt="Priyanshu Singh">
<h1>Priyanshu Singh</h1>
<p class="sub">Personal Profile</p>
<span class="badge">Student • Creator</span>
</div>

<section>
<h2>About Me</h2>
<div class="grid">
<div class="box"><div class="label">Certificate Name</div><div class="value">Priyanshu Kumar</div></div>
<div class="box"><div class="label">Displayed Name</div><div class="value">Priyanshu Singh</div></div>
<div class="box"><div class="label">Age</div><div class="value">17 Years</div></div>
<div class="box"><div class="label">Education</div><div class="value">ITI • Mechanic Diesel</div></div>
</div>
</section>

<section>
<h2>Education</h2>
<div class="marks">
<div class="mark">Class 10th<strong>382</strong><small>Marks</small></div>
<div class="mark">Class 12th<strong>322</strong><small>Marks</small></div>
</div>
</section>

<section>
<h2>Connect</h2>
<a class="btn" href="https://www.instagram.com/unknwon__person__pk__/" target="_blank" rel="noopener">📸 Instagram</a>
</section>
</div>
<footer>© 2026 Priyanshu Singh</footer>
</div>
</body>
</html>
